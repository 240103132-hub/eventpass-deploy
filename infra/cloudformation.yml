AWSTemplateFormatVersion: '2010-09-09'
Description: EventPass deployment on AWS EC2 Free Tier using Docker Compose

Parameters:
  InstanceType:
    Type: String
    Default: t3.micro
    Description: EC2 instance type (Free Tier eligible)
  KeyName:
    Type: AWS::EC2::KeyName::Key
    Description: Name of an existing EC2 KeyPair for SSH access

Resources:
  EventPassSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP, HTTPS and SSH access
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0

  EventPassInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: ami-0c7217cdde317cfec # Amazon Linux 2023 AMI (x86_64)
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      SecurityGroupIds:
        - !Ref EventPassSecurityGroup
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          dnf update -y
          dnf install -y docker git
          systemctl start docker
          systemctl enable docker
          usermod -aG docker ec2-user

          # Install Docker Compose
          curl -L "https://github.com/docker/compose/releases/download/v2.24.0/docker-compose-linux-x86_64" -o /usr/local/bin/docker-compose
          chmod +x /usr/local/bin/docker-compose

          # Clone repository and run docker compose
          cd /home/ec2-user
          git clone https://github.com/240103132-hub/eventpass-deploy.git app
          cd app
          docker-compose up -d

Outputs:
  InstancePublicIP:
    Description: Public IP of the EventPass EC2 instance
    Value: !GetAtt EventPassInstance.PublicIp
