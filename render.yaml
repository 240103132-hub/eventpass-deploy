services:
  - type: web
    name: eventpass
    env: docker
    region: frankfurt
    plan: free
    branch: main
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eventpass-db
          property: connectionString

databases:
  - name: eventpass-db
    databaseName: eventpass
    user: eventpass_user
    plan: free
    region: frankfurt
