services:
  - type: web
    name: eventpass
    runtime: docker
    region: frankfurt
    plan: free
    branch: main
    # CI (GitHub Actions) triggers the deploy through a deploy hook after all tests pass
    autoDeployTrigger: "off"
    healthCheckPath: /api/venues
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eventpass-db
          property: connectionString

databases:
  - name: eventpass-db
    databaseName: eventpass
    user: eventpass_user
    plan: free
    region: frankfurt
