version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: eventpass_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eventpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eventpass"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: eventpass_app
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@db:5432/eventpass
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
